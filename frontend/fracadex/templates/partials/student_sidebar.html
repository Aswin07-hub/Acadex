<aside class="sidebar">

    <div class="brand">
        <div class="brand-logo">A</div>
        <span>ACADEX</span>
    </div>

    <nav class="sidebar-nav">

        <a href="{% url 'student_dashboard' %}"
           class="nav-link {% if request.resolver_match.url_name == 'student_dashboard' %}active{% endif %}">
            <span>⌂</span> Dashboard
        </a>

        <a href="{% url 'my_documents_page' %}"
           class="nav-link {% if request.resolver_match.url_name == 'my_documents_page' %}active{% endif %}">
            <span>▤</span> My Documents
        </a>

        <a href="{% url 'help_support' %}"
           class="nav-link {% if request.resolver_match.url_name == 'help_support' %}active{% endif %}">
            <span>?</span> Help & Support
        </a>

        <a href="{% url 'student_dashboard' %}#events"
           class="nav-link">
            <span>▦</span> Campus Events
        </a>

        <a href="{% url 'notifications' %}"
           class="nav-link {% if request.resolver_match.url_name == 'notifications' %}active{% endif %}">
            <span>♧</span> Notifications
        </a>

        <a href="{% url 'student_profile' %}"
           class="nav-link {% if request.resolver_match.url_name == 'student_profile' %}active{% endif %}">
            <span>○</span> My Profile
        </a>

    </nav>

    <div class="sidebar-bottom">
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" class="logout-button">
                <span>↪</span> Logout
            </button>
        </form>
    </div>

</aside>
